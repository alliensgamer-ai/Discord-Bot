kind = "web"
previewPath = "/"
title = "Puzzles Bot"
description = "Aplicación de producción para ejecutar de forma persistente el bot competitivo de Free Fire para Discord."
version = "1.0.0"
id = "artifacts/puzzles-bot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23127

[services.development]
run = "pnpm --filter @workspace/puzzles-bot run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/discord-bot", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/discord-bot", "run", "start" ]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "23127"
BASE_PATH = "/"
